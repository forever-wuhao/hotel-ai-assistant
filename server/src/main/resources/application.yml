server:
  port: ${SERVER_PORT:9090}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
hotel-ai:
  mode: ${HOTEL_AI_MODE:disabled}
  api-key: ${ZHIPU_API_KEY:}
  base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas}
  chat-model: ${ZHIPU_CHAT_MODEL:glm-4.7}
  embedding-model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
  amap-key: ${AMAP_WEB_SERVICE_KEY:}
  knowledge-manifest: ${KNOWLEDGE_MANIFEST:}
  cache-directory: ${KNOWLEDGE_CACHE:runtime/knowledge}
  max-iterations: 6
  request-timeout-seconds: 20
  session-ttl-minutes: 30
  max-sessions: 500
  data-kind: live
